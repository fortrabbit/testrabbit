name: Test & Deploy
env:
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  GIT_SSH_COMMAND: "ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa"
  DOCKER_REGISTRY_IMAGE: ghcr.io/fortrabbit/testrabbit

on:
  push:

jobs:

  # Old-platform coverage: build the local Ubuntu image and boot the app on
  # every PHP version the old platform serves, down to 7.4. Zero-dependency
  # plain PHP (IN-1649), so there is no composer install to break per version.
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v3

      - name: Build image
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          docker build \
            --file docker/Dockerfile \
            --build-arg PHP_VERSION=${PHP_VERSION} \
            --tag $DOCKER_REGISTRY_IMAGE:${PHP_VERSION} \
            .

      - name: Boot the app and check it responds
        run: |
          docker run -d --name tr -p 8000:8000 $DOCKER_REGISTRY_IMAGE:${{ matrix.php-version }}
          ./scripts/smoke.sh http://localhost:8000
          docker rm -f tr

  # New-platform coverage: run the exact same suite INSIDE the platform's own
  # k8s container images, so "the test k8s images should work too" (IN-1649) is
  # verified against what production actually ships. The k8s images floor at 8.1.
  #
  # Non-blocking (continue-on-error): the k8s-php images live in the k8s-images
  # repo's packages, which the default GITHUB_TOKEN cannot pull. To make this
  # actually run, provision a GHCR_TOKEN secret (a PAT with read:packages, or
  # grant the packages access to this repo). Until then it reports but does not
  # gate the PR or the deploys.
  test-k8s:
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Boot testrabbit inside the k8s image and check it responds
        run: |
          tag="${{ matrix.php-version }}"; tag="${tag/./}"   # 8.1 -> 81
          image="ghcr.io/fortrabbit/k8s-php-${tag}"
          docker run -d --name trk8s \
            -v "$PWD:/var/www/html" -w /var/www/html \
            -p 8000:8000 \
            --entrypoint php "$image" -S 0.0.0.0:8000 -t public
          ./scripts/smoke.sh http://localhost:8000
          docker rm -f trk8s

  usx:
    runs-on: ubuntu-22.04
    needs: [test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      -   name: Checkout
          uses: actions/checkout@v3
          with:
            # fetch all history so we can push to remotes
            fetch-depth: 0

      -   name: Setup SSH Keys and known_hosts
          run: |
            ssh-agent -a $SSH_AUTH_SOCK > /dev/null
            ssh-add - <<EOF
            ${{ secrets.SSH_PRIVATE_KEY }}
            EOF
            ssh-add -l

      -   name: 'Run deployment to testrabbit-pro'
          run: |
            git push --force testrabbit-pro@deploy.usx.frbit.com:testrabbit-pro.git HEAD:master

      -   name: 'Run deployment to testrabbit-uni'
          run: |
            git push --force testrabbit-uni@deploy.usx.frbit.com:testrabbit-uni.git HEAD:master

  eu2:
    runs-on: ubuntu-22.04
    needs: [test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      -   name: Checkout
          uses: actions/checkout@v3
          with:
            # fetch all history so we can push to remotes
            fetch-depth: 0

      -   name: Setup SSH Keys and known_hosts
          run: |
            ssh-agent -a $SSH_AUTH_SOCK > /dev/null
            ssh-add - <<EOF
            ${{ secrets.SSH_PRIVATE_KEY }}
            EOF
            ssh-add -l

      -   name: 'Run deployment to testrabbit-pro'
          run: |
            git push --force testrabbit-pro@deploy.eu2.frbit.com:testrabbit-pro.git HEAD:master
            #echo "slack_environment=EU2" >> $GITHUB_ENV

      -   name: 'Run deployment to testrabbit-uni'
          run: |
            git push --force testrabbit-uni@deploy.eu2.frbit.com:testrabbit-uni.git HEAD:master

  us1:
    runs-on: ubuntu-22.04
    needs: [test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      -   name: Checkout
          uses: actions/checkout@v3
          with:
            # fetch all history so we can push to remotes
            fetch-depth: 0

      -   name: Setup SSH Keys and known_hosts
          run: |
            ssh-agent -a $SSH_AUTH_SOCK > /dev/null
            ssh-add - <<EOF
            ${{ secrets.SSH_PRIVATE_KEY }}
            EOF
            ssh-add -l

      -   name: 'Run deployment to testrabbit-us1'
          run: |
            git push --force testrabbit-us1@deploy.us1.frbit.com:testrabbit-us1.git HEAD:master

      -   name: 'Run deployment to testrabbit-us1-u'
          run: |
            git push --force testrabbit-us1-u@deploy.us1.frbit.com:testrabbit-us1-u.git HEAD:master
