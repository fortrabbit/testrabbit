# fortrabbit deployment config
version: 2

# testrabbit is a zero-dependency plain-PHP app (IN-1649): no composer.json, so
# no Composer run on deploy, and no pre/post build hooks. Deploy just ships the
# files. This is what lets the same code run on every PHP version the platform
# serves (7.4 → 8.5), old platform and new-platform k8s images alike.
